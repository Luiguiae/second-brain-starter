# --- Los 3 arquetipos + 1 híbrido (docs/BENCHMARK.md) ----------------------
archetypes:
  - id: action_first
    name: Acción-primero
    description: >-
      PARA puro. Sirve cuando el dolor principal es "no sé dónde archivar
      cosas ni qué hacer con ellas", no "no conecto ideas".
    folders: ["Projects/", "Areas/", "Resources/", "Archive/"]
    frontmatter_fields: ["estado", "area", "fecha_revision"]
  - id: knowledge_first
    name: Conocimiento-primero
    description: >-
      Zettelkasten + LYT + Evergreen. Sirve cuando el dolor es producir
      escritura/pensamiento original a partir de lo leído. Estructura:
      Inbox (fleeting) → Notas permanentes (atómicas) → MOCs (hubs
      temáticos) → Home note.
    folders: ["Inbox/", "Notas-permanentes/", "MOCs/"]
    frontmatter_fields: ["tipo_nota", "estado", "fecha_creacion", "conexiones"]
  - id: agent_first
    name: Agente-primero
    description: >-
      Pensado explícitamente para que un agente de código opere sobre el
      vault, no solo para que un humano navegue. INDEX.md (humano) +
      manifest.json (máquina) + AGENTS.md/CLAUDE.md en la raíz con las
      reglas de operación.
    folders: ["active/", "reference/", "archive/"]
    frontmatter_fields: ["estado", "ttl"]
  - id: hybrid
    name: Híbrido
    description: >-
      PARA como capa de acción + Zettelkasten/LYT para conocimiento
      profundo + capa agent-native encima (frontmatter + CLAUDE.md) para
      que el agente opere sobre ambas capas. El caso más común en usuarios
      técnicos; el campo `estado: activo/dormant/archivado` es el
      mecanismo de "tiers" del arquetipo agent-native aplicado sobre la
      estructura PARA + Zettelkasten, sin carpetas active/reference/archive
      separadas.
    folders: ["Projects/", "Areas/", "Resources/", "Archive/", "Inbox/", "Notas-permanentes/", "MOCs/"]
    frontmatter_fields: ["estado", "area", "tipo_nota", "ttl"]

# --- Las 5 dimensiones del diagnóstico (docs/SPEC.md, "Copy del diagnóstico") ---
dimensions:
  - id: purpose
    question: "¿Cuál es el objetivo principal de tu Segundo Cerebro?"
    options:
      - value: execute_projects
        label: "Ejecutar y dar seguimiento a proyectos activos"
      - value: produce_knowledge
        label: "Producir conocimiento propio: escribir, investigar"
      - value: agent_memory
        label: "Que un agente de IA opere sobre mis notas como memoria de trabajo"
      - value: study
        label: "Estudiar y retener contenido"
  - id: maintenance_tolerance
    question: "¿Cuánto tiempo quieres invertir manteniendo el sistema?"
    options:
      - value: low
        label: "Poco, quiero organización automática"
      - value: medium
        label: "Algo, una revisión periódica está bien"
      - value: high
        label: "Mucho, disfruto estructurar y conectar notas a mano"
  - id: agent_usage
    question: "¿Usas o planeas usar agentes de código (Claude Code, Cursor) sobre tus notas?"
    options:
      - value: already_using
        label: "Ya lo hago"
      - value: want_to_start
        label: "No todavía, pero quiero empezar"
      - value: not_interested
        label: "No me interesa por ahora"
  - id: capture_volume
    question: "¿Con qué frecuencia capturas información nueva?"
    options:
      - value: sporadic
        label: "Esporádicamente"
      - value: daily_moderate
        label: "A diario, de una o dos fuentes"
      - value: high_multi_source
        label: "A diario, de muchas fuentes distintas"
  - id: technical_profile
    question: "¿Qué tan cómodo estás trabajando con archivos markdown y git?"
    options:
      - value: markdown_git_comfortable
        label: "Muy cómodo, prefiero texto plano"
      - value: prefers_visual_ui
        label: "Prefiero una interfaz visual"

# --- Lógica de decisión (docs/SPEC.md, sección homónima) -------------------
decision_rules:
  base_by_purpose:
    - purpose: execute_projects
      archetype: action_first
      source_refs: [forte_labs_basb]
    - purpose: produce_knowledge
      archetype: knowledge_first
      source_refs: [obsibrain_zettelkasten_guide, taskade_lyt_blog]
    - purpose: agent_memory
      archetype: agent_first
      source_refs: [agent_native_oss_projects]
    - purpose: study
      archetype: knowledge_first
      note: >-
        Variante ligera de Conocimiento-primero. Cornell/Outline se
        mencionan solo como nota textual de recomendación; implementarlos
        como arquetipos propios está fuera de alcance en v1
        (docs/SPEC.md, "Fuera de alcance").
      source_refs: [obsibrain_zettelkasten_guide]

  hybrid_modifier:
    trigger_agent_usage: [already_using, want_to_start]
    source_refs: [agent_native_oss_projects]

  lyt_modifier:
    trigger_maintenance_tolerance: low
    applies_to_base_archetype: knowledge_first
    note: >-
      Baja tolerancia a mantenimiento manual + arquetipo base
      Conocimiento-primero → se recomienda LYT (MOCs) en vez de
      Zettelkasten puro (menor fricción).
    source_refs: [taskade_lyt_blog]

  capture_volume_modifiers:
    - value: sporadic
      add_folders: []
      add_skill_id: null
      source_refs: []
    - value: daily_moderate
      add_folders: ["Inbox/"]
      add_skill_id: null
      source_refs: [forte_labs_basb, obsibrain_zettelkasten_guide]
    - value: high_multi_source
      add_folders: ["Inbox/"]
      add_skill_id: clasificador-de-fuentes
      source_refs: [forte_labs_basb, obsibrain_zettelkasten_guide]

  technical_profile_modifiers:
    - value: markdown_git_comfortable
      justification_template: >-
        Perfil técnico cómodo con markdown/git: se recomienda implementar
        la estructura en archivos planos (Markdown) versionados con git,
        sin depender de una app propietaria.
      default_system_ref: agent_native
    - value: prefers_visual_ui
      justification_template: >-
        Perfil técnico que prefiere interfaz visual: se recomienda
        implementar la misma estructura en una herramienta visual acorde
        al arquetipo.
      default_system_ref: tana_supertags
      system_ref_by_archetype:
        action_first: para_basb
        knowledge_first: lyt_moc
        agent_first: tana_supertags
        hybrid: tana_supertags

# --- Skills iniciales (docs/BENCHMARK.md, "Mapeo arquetipo → estructura → skills") ---
skills_catalog:
  - id: captura-rapida
    name: captura-rapida
    description: >-
      Procesa el inbox de PARA: convierte capturas sueltas en proyectos,
      áreas o recursos accionables (inbox processing).
    archetypes: [action_first]
    priority: 1
  - id: revision-semanal
    name: revision-semanal
    description: "Checklist de revisión semanal PARA: qué proyectos están activos, qué archivar, qué mover de área."
    archetypes: [action_first]
    priority: 2
  - id: plantilla-proyecto
    name: plantilla-proyecto
    description: "Plantilla de estructura para un proyecto nuevo dentro de Projects/, con criterio de éxito y fecha de cierre."
    archetypes: [action_first]
    priority: 3

  - id: captura-atomica
    name: captura-atomica
    description: "Convierte una fleeting note del Inbox en una nota permanente atómica (una idea por nota)."
    archetypes: [knowledge_first]
    priority: 1
  - id: vinculacion-bidireccional
    name: vinculacion-bidireccional
    description: "Sugiere y crea enlaces bidireccionales entre notas permanentes relacionadas."
    archetypes: [knowledge_first]
    priority: 2
  - id: moc-builder
    name: moc-builder
    description: "Construye o actualiza un MOC (Map of Content) que agrupa notas permanentes por tema."
    archetypes: [knowledge_first]
    priority: 3
  - id: revision-conexiones
    name: revision-conexiones
    description: "Revisión periódica de notas huérfanas (sin enlaces) para reforzar la red de conexiones."
    archetypes: [knowledge_first]
    priority: 4

  - id: ingest-source
    name: ingest-source
    description: "Ingiere una fuente nueva (documento, transcripción, código) al vault agent-native con frontmatter y estado inicial."
    archetypes: [agent_first]
    priority: 1
  - id: lint-vault
    name: lint-vault
    description: "Verifica consistencia de frontmatter (campos obligatorios, valores válidos de estado) en todo el vault."
    archetypes: [agent_first]
    priority: 2
  - id: estado-tracker
    name: estado-tracker
    description: "Mueve notas de active/ a reference/ a archive/ según su TTL y estado declarado en el frontmatter."
    archetypes: [agent_first]
    priority: 3

  - id: clasificador-de-fuentes
    name: clasificador-de-fuentes
    description: >-
      Clasifica automáticamente las capturas entrantes por fuente/tipo
      cuando el volumen de captura es alto y multi-fuente, antes de que
      lleguen al Inbox (docs/SPEC.md, modificador de capture_volume).
    archetypes: [action_first, knowledge_first, agent_first, hybrid]
    priority: 0
